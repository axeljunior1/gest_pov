# Profil production — aucune donnee commerciale ou demo au demarrage
spring:
  config:
    activate:
      on-profile: prod

app:
  seed:
    system-enabled: true
    demo-enabled: false
    demo-auto: false
    default-users-enabled: false
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${APP_BOOTSTRAP_ADMIN_NAME:Admin}
      last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:ERP}
  admin:
    reset-enabled: false
  jwt:
    secret: ${APP_JWT_SECRET:erp-dev-secret-change-in-production-min-256-bits-long-key!!}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.erp.products: INFO
